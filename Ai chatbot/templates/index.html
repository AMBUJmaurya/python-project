<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Helpdesk Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <h2>College Helpdesk Chatbot</h2>
        <div id="chat-box"></div>
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Apna sawal yahan likhein..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>
    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = userInput.value.trim();
            if (!question) return;
            appendMessage('You', question);
            userInput.value = '';
            appendMessage('Bot', 'Typing...');
            const res = await fetch('/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question})
            });
            const data = await res.json();
            chatBox.lastChild.remove(); // Remove 'Typing...'
            appendMessage('Bot', data.answer);
        });

        function appendMessage(sender, message) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'You' ? 'user-msg' : 'bot-msg';
            msgDiv.textContent = `${sender}: ${message}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
